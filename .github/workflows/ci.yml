name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r resources/rpc/requirements.txt
      - name: Compile Python bridge
        run: python -m py_compile resources/rpc/rpc_bridge.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check extension JavaScript syntax
        run: node --check extension.js
